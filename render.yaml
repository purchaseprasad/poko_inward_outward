# Render Blueprint – creates the database and the API (backend) together.
databases:
  - name: poko-inward-outward-db
    databaseName: pokonut_wms
    user: pokonut
    plan: free            # free databases are deleted after 30 days – upgrade to a paid plan before real use

services:
  - type: web
    name: poko-inward-outward-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: poko-inward-outward-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # --- fill these in the Render dashboard (Environment tab) ---
      - key: APP_URL              # your Netlify address, e.g. https://poko-warehouse.netlify.app
        sync: false
      - key: ADMIN_LOGIN_EMAIL    # login e-mail of the first Admin
        sync: false
      - key: SEED_PASSWORD        # first Admin password (if empty, a random one is printed once in the logs)
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SMTP_HOST            # only if you send from Zoho instead of Gmail
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: QUALITY_EMAIL
        sync: false
      - key: FINANCE_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
